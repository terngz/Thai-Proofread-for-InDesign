name: Build macOS Binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # ปุ่มกดสั่ง Build มือบน GitHub

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pythainlp pyspellchecker pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --console --name "spellcheck_server" \
            --collect-data pythainlp \
            --collect-data spellchecker \
            spellcheck_server.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spellcheck_server_mac
          path: dist/spellcheck_server/